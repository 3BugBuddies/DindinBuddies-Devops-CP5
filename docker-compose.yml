# Ambiente local completo: SQL Server, API e front.
# Uso: copie .env.example para .env, defina a senha e rode `docker compose up --build`.
#   Front:   http://localhost:3000
#   API:     http://localhost:5000  (Swagger em /swagger)
#   Banco:   localhost,1433 (usuário sa)

name: dindinbuddies

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # A imagem só existe para amd64; em Mac com chip Apple roda via Rosetta (ativar no Docker Desktop).
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Defina SQL_SA_PASSWORD no arquivo .env}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-dados:/var/opt/mssql
    networks:
      - dindinbuddies-rede
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: ./api
    environment:
      ConnectionStrings__DindinBuddies: "Server=sqlserver,1433;Database=DindinBuddies;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
      Cors__OrigemFront: "http://localhost:3000"
    ports:
      - "5000:8080"
    networks:
      - dindinbuddies-rede
    depends_on:
      sqlserver:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        # O navegador chama a API pela porta publicada no host.
        VITE_API_URL: "http://localhost:5000"
    ports:
      - "3000:80"
    networks:
      - dindinbuddies-rede
    depends_on:
      - api

volumes:
  sqlserver-dados:

networks:
  dindinbuddies-rede:
